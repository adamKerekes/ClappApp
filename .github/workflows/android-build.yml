name: Android build

# Minden main-re kerülő változás után elindít egy Android buildet az EAS-en.
# Kézzel is indítható: GitHub → Actions → Android build → Run workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profil (preview = önálló app, development = dev client)'
        type: choice
        options: [preview, development]
        default: preview

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ inputs.profile || 'preview' }}
    steps:
      - name: EXPO_TOKEN ellenőrzése
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Hiányzik az EXPO_TOKEN secret. Repo → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Ha az app.json-ban még nincs projectId, összeköti a meglévő Expo projekttel
      # (csak ebben a futásban, a repóba nem ír vissza).
      - name: Expo projekt összekötése
        run: |
          if ! grep -q '"projectId"' app.json; then
            eas init --non-interactive --force
          fi

      - name: Build indítása
        run: |
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait --json > build.json
          cat build.json
          BUILD_ID=$(node -p "require('./build.json')[0].id")
          OWNER=$(node -p "require('./build.json')[0].app.ownerAccount.name")
          SLUG=$(node -p "require('./build.json')[0].app.slug")
          URL="https://expo.dev/accounts/$OWNER/projects/$SLUG/builds/$BUILD_ID"
          {
            echo "## Android build elindult ($PROFILE)"
            echo
            echo "10–30 perc múlva itt telepíthető a telefonra: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
